name: Публикация проекта «След»

on:
  push:
    branches: [main]
    paths:
      - "projects/sled/**"
      - ".github/workflows/sled-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить статический сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/sled
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
